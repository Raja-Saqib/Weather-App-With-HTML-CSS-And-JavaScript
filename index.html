
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <div class="weather-container">

    <div class="theme-toggle-container">
      <button
        id="themeToggle"
        class="theme-toggle"
        type="button"
        aria-label="Switch to dark mode"
        aria-pressed="false"
      >
        🌙 Dark Mode
      </button>
    </div>

    <h1>Weather App</h1>

    <div class="search-box">
      <input
        type="text"
        id="cityInput"
        placeholder="Enter city name"
      >
      <button id="searchBtn">Search</button>
    </div>

    <!-- Recent Search History -->
    <div class="history-container" id="historyContainer">

      <div class="history-header">
        <h3>Recent Searches</h3>

        <button
          id="clearHistoryBtn"
          class="clear-history-btn"
          type="button"
        >
          Clear
        </button>
      </div>

      <div
        id="recentSearches"
        class="recent-searches"
        aria-live="polite"
      >
        <p class="empty-history">No recent searches yet.</p>
      </div>

    </div>

    <button id="locationBtn" class="location-btn">
      📍 Use My Current Location
    </button>

    <div id="loading" class="loading" style="display: none;">
      <div class="spinner"></div>
      <p id="loadingText">Loading weather...</p>
    </div>

    <p id="statusMsg" class="status"></p>

    <div class="weather-info" id="weatherInfo">
      <h2 id="cityName"></h2>

      <div id="weatherIcon" class="weather-icon" aria-label="Weather icon">
        🌤️
      </div>

      <div class="unit-toggle">
        <button id="celsiusBtn" class="unit-btn active" type="button">
          °C
        </button>

        <button id="fahrenheitBtn" class="unit-btn" type="button">
          °F
        </button>
      </div>

      <p id="temperature"></p>
      <p id="condition"></p>

      <div class="details">
        <span id="humidity"></span>
        <span id="wind"></span>
      </div>
    </div>

    <p class="error" id="errorMsg"></p>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
